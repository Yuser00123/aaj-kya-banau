services:
  - type: web
    name: aaj-kya-banau
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemma-4-31b-it
      - key: REPO_URL
        value: https://github.com/Yuser00123/aaj-kya-banau
      - key: LLM_API_KEY
        sync: false
